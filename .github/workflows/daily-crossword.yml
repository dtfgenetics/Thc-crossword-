name: Daily Crossword

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-crossword-publisher
  cancel-in-progress: false

jobs:
  build-daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate or promote daily puzzle
        run: npm run crossword:publish-today

      - name: Verify daily product output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const puzzle = JSON.parse(fs.readFileSync('public/puzzles/current.json', 'utf8'));
          if (puzzle.puzzleType !== 'daily') {
            throw new Error(`Expected daily current puzzle, got ${puzzle.puzzleType}`);
          }
          if (!String(puzzle.title).startsWith('THC Daily Crossword')) {
            throw new Error('Current puzzle title is not daily');
          }
          if ((puzzle.words || []).length < 12) {
            throw new Error(`Daily puzzle too small: ${(puzzle.words || []).length} words`);
          }
          NODE

      - name: Validate puzzles and exports
        run: |
          npm run crossword:validate
          npm run crossword:validate-ipuz
          npm run crossword:validate-exolve
          npm run crossword:check-exports

      - name: Test
        run: npm test

      - name: Verify project
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Publish generated puzzle through PR gate
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_BRANCH: automation/daily-crossword
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$AUTOMATION_BRANCH"
          git add public/puzzles
          test ! -f package-lock.json || git add package-lock.json

          if git diff --cached --quiet; then
            echo "No generated puzzle changes to publish."
            exit 0
          fi

          git commit -m "Generate daily crossword"
          git push --force-with-lease origin "HEAD:$AUTOMATION_BRANCH"

          if gh pr view "$AUTOMATION_BRANCH" --json number >/dev/null 2>&1; then
            echo "Existing daily crossword PR updated."
          else
            gh pr create \
              --base main \
              --head "$AUTOMATION_BRANCH" \
              --title "Generate daily crossword" \
              --body "Automated daily crossword generation. Merge only after CI validates the generated puzzle, tests, and production build."
          fi
