name: Publish Weekly Crossword

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1'

permissions:
  contents: write

concurrency:
  group: weekly-crossword-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run crossword:audit
      - run: npm test
      - run: npm run crossword:publish-next -- --through-current
      - run: npm run crossword:validate
      - run: npm run crossword:validate-ipuz
      - run: npm run crossword:validate-exolve
      - run: npm run crossword:check-exports
      - run: npm run verify
      - run: npm run build
      - name: Commit newly generated weekly puzzles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/puzzles; then
            echo 'Crossword archive is already current.'
            exit 0
          fi
          git config user.name 'dtf-crossword-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/puzzles
          git commit -m 'Publish weekly crossword archive'
          git push origin HEAD:main
